<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うんち記録</title>

<style>
body {
  font-family: sans-serif;
  background: #f7f3ed;
  margin: 0;
  padding: 20px;
  color: #333;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.date {
  text-align: center;
  font-size: 20px;
  margin-bottom: 20px;
}

.count {
  text-align: center;
  font-size: 18px;
  margin-bottom: 15px;
}

.record-button {
  width: 100%;
  padding: 18px;
  font-size: 22px;
  border: none;
  border-radius: 15px;
  background: #8b6b4a;
  color: white;
  cursor: pointer;
}

.types {
  display: none;
  margin-top: 15px;
  gap: 8px;
  flex-direction: column;
}

.types button {
  padding: 14px;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
  cursor: pointer;
}

.records {
  margin-top: 25px;
}

.record {
  background: white;
  padding: 14px;
  margin-bottom: 8px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
}

.empty {
  text-align: center;
  color: #888;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>💩 うんち記録</h1>

<div class="date" id="date"></div>

<div class="count">
今日 <span id="count">0</span> 回
</div>

<button class="record-button" onclick="showTypes()">
💩 記録する
</button>

<div class="types" id="types">
  <button onclick="addRecord('硬い')">① 硬い</button>
  <button onclick="addRecord('普通')">② 普通</button>
  <button onclick="addRecord('やや軟らかい')">③ やや軟らかい</button>
  <button onclick="addRecord('軟便')">④ 軟便</button>
  <button onclick="addRecord('下痢')">⑤ 下痢</button>
</div>

<div class="records" id="records"></div>

</div>

<script>

let records = JSON.parse(localStorage.getItem("poopRecords")) || [];

function todayString() {
  const now = new Date();
  return now.toLocaleDateString("ja-JP");
}

function showDate() {
  document.getElementById("date").textContent = todayString();
}

function showTypes() {
  document.getElementById("types").style.display = "flex";
}

function addRecord(type) {

  const now = new Date();

  const record = {
    date: todayString(),
    time: now.toLocaleTimeString("ja-JP", {
      hour: "2-digit",
      minute: "2-digit"
    }),
    type: type
  };

  records.push(record);

  localStorage.setItem("poopRecords", JSON.stringify(records));

  document.getElementById("types").style.display = "none";

  displayRecords();
}

function displayRecords() {

  const today = todayString();

  const todayRecords = records.filter(
    record => record.date === today
  );

  document.getElementById("count").textContent =
    todayRecords.length;

  const area = document.getElementById("records");

  if (todayRecords.length === 0) {
    area.innerHTML =
      '<div class="empty">まだ記録がありません</div>';
    return;
  }

  area.innerHTML = todayRecords
    .slice()
    .reverse()
    .map(record => `
      <div class="record">
        <span>${record.time}</span>
        <span>${record.type}</span>
      </div>
    `)
    .join("");
}

showDate();
displayRecords();

</script>

</body>
</html>
