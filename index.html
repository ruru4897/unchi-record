<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うんち記録</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f1e8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      height: 80px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #8b6f47;
      color: white;
      cursor: pointer;
    }

    .record {
      margin-top: 20px;
      padding: 15px;
      background: #f7f1e8;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💩 うんち記録</h1>

    <label>日にち</label>
    <input type="date" id="date">

    <label>時間</label>
    <input type="time" id="time">

    <label>状態</label>
    <select id="condition">
      <option value="">選んでね</option>
      <option>硬い</option>
      <option>普通</option>
      <option>やや柔らかい</option>
      <option>柔らかい</option>
      <option>下痢</option>
    </select>

    <label>メモ</label>
    <textarea id="memo" placeholder="色・量・お腹の調子など"></textarea>

    <button onclick="record()">記録する</button>

    <div id="records"></div>

  </div>

  <script>
    function record() {
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const condition = document.getElementById("condition").value;
      const memo = document.getElementById("memo").value;

      if (!date || !time || !condition) {
        alert("日にち・時間・状態を入力してね");
        return;
      }

      const record = document.createElement("div");
      record.className = "record";

      record.innerHTML = `
        <strong>${date} ${time}</strong><br>
        状態：${condition}<br>
        メモ：${memo || "なし"}
      `;

      document.getElementById("records").appendChild(record);

      alert("記録しました！");
    }
  </script>

</body>
</html>
