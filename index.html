<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うんち記録</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: #f7f1e8;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      margin-top: 5px;
    }

    h2 {
      font-size: 20px;
      margin-top: 30px;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .main-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #8b6f47;
      color: white;
      cursor: pointer;
    }

    .cancel-button {
      background: #999;
    }

    .summary {
      background: #f7f1e8;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.8;
    }

    .record {
      margin-top: 15px;
      padding: 15px;
      background: #f7f1e8;
      border-radius: 10px;
    }

    .record-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .record-buttons button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .edit-button {
      background: #777;
      color: white;
    }

    .delete-button {
      background: #aaa;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: #f7f1e8;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-header button {
      border: none;
      background: #8b6f47;
      color: white;
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
    }

    .calendar-title {
      font-weight: bold;
      font-size: 18px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      padding: 5px 0;
      font-size: 13px;
    }

    .day {
      min-height: 55px;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      font-size: 13px;
    }

    .day.has-record {
      background: #f7f1e8;
    }

    .poop {
      font-size: 18px;
      display: block;
      margin-top: 3px;
    }

    .today {
      border: 2px solid #8b6f47;
    }

    @media (max-width: 500px) {
      body {
        padding: 8px;
      }

      .container {
        padding: 15px;
        border-radius: 10px;
      }

      h1 {
        font-size: 24px;
      }

      .day {
        min-height: 50px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💩 うんち記録</h1>

  <!-- 入力 -->
  <label>日にち</label>
  <input type="date" id="date">

  <label>時間</label>
  <input type="time" id="time">

  <label>状態</label>
  <select id="condition">
    <option value="">選んでね</option>
    <option>硬い</option>
    <option>普通</option>
    <option>やや柔らかい</option>
    <option>柔らかい</option>
    <option>下痢</option>
  </select>

  <label>便の量</label>
  <select id="amount">
    <option value="">選んでね</option>
    <option>少ない</option>
    <option>普通</option>
    <option>多い</option>
  </select>

  <label>メモ</label>
  <textarea id="memo" placeholder="色・お腹の調子など"></textarea>

  <button class="main-button" id="saveButton" onclick="record()">
    記録する
  </button>

  <button
    class="main-button cancel-button"
    id="cancelButton"
    onclick="cancelEdit()"
    style="display:none;">
    編集をやめる
  </button>


  <!-- 今日・期間の集計 -->
  <h2>📊 集計</h2>

  <div class="stats">

    <div class="stat-box">
      今日
      <div class="stat-number" id="todayCount">0</div>
      回
    </div>

    <div class="stat-box">
      今週
      <div class="stat-number" id="weekCount">0</div>
      回
    </div>

    <div class="stat-box">
      今月
      <div class="stat-number" id="monthCount">0</div>
      回
    </div>

    <div class="stat-box">
      前回から
      <div class="stat-number" id="interval">---</div>
    </div>

  </div>


  <!-- カレンダー -->
  <h2>📅 カレンダー</h2>

  <div class="calendar-header">
    <button onclick="changeMonth(-1)">←</button>

    <div class="calendar-title" id="calendarTitle"></div>

    <button onclick="changeMonth(1)">→</button>
  </div>

  <div class="calendar" id="calendar"></div>


  <!-- 記録一覧 -->
  <h2>📋 記録一覧</h2>

  <div id="records"></div>

</div>


<script>

  // 保存されている記録を読み込む
  let records =
    JSON.parse(localStorage.getItem("unchiRecords")) || [];

  // 編集中の記録番号
  let editingIndex = -1;

  // カレンダーで表示している月
  let calendarDate = new Date();


  // 今日の日付を YYYY-MM-DD にする
  function getToday() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  // 現在時刻を HH:MM にする
  function getCurrentTime() {

    const now = new Date();

    const hour =
      String(now.getHours()).padStart(2, "0");

    const minute =
      String(now.getMinutes()).padStart(2, "0");

    return `${hour}:${minute}`;
  }


  // 新しい記録を保存
  function record() {

    const date =
      document.getElementById("date").value;

    const time =
      document.getElementById("time").value;

    const condition =
      document.getElementById("condition").value;

    const amount =
      document.getElementById("amount").value;

    const memo =
      document.getElementById("memo").value;


    if (!date || !time || !condition || !amount) {

      alert("日にち・時間・状態・便の量を入力してね");

      return;
    }


    const newRecord = {

      date: date,
      time: time,
      condition: condition,
      amount: amount,
      memo: memo

    };


    // 編集中
    if (editingIndex !== -1) {

      records[editingIndex] = newRecord;

      editingIndex = -1;

      document.getElementById("saveButton").textContent =
        "記録する";

      document.getElementById("cancelButton").style.display =
        "none";

      alert("記録を変更しました！");

    }

    // 新規記録
    else {

      records.push(newRecord);

      alert("記録しました！");
    }


    // 新しい順に並べる
    records.sort(function(a, b) {

      const dateA = new Date(
        a.date + "T" + a.time
      );

      const dateB = new Date(
        b.date + "T" + b.time
      );

      return dateB - dateA;

    });


    // 保存
    localStorage.setItem(
      "unchiRecords",
      JSON.stringify(records)
    );


    clearForm();

    displayRecords();

    updateStats();

    displayCalendar();

  }


  // 記録を画面に表示
  function displayRecords() {

    const area =
      document.getElementById("records");

    area.innerHTML = "";


    records.forEach(function(item, index) {

      const record =
        document.createElement("div");

      record.className = "record";


      record.innerHTML = `

        <strong>
          ${item.date} ${item.time}
        </strong>

        <br>

        状態：${item.condition}

        <br>

        量：${item.amount || "未入力"}

        <br>

        メモ：${item.memo || "なし"}

        <div class="record-buttons">

          <button
            class="edit-button"
            onclick="editRecord(${index})">
            ✏️ 編集
          </button>

          <button
            class="delete-button"
            onclick="deleteRecord(${index})">
            🗑️ 削除
          </button>

        </div>

      `;


      area.appendChild(record);

    });

  }


  // 編集
  function editRecord(index) {

    const item = records[index];


    document.getElementById("date").value =
      item.date;

    document.getElementById("time").value =
      item.time;

    document.getElementById("condition").value =
      item.condition;

    document.getElementById("amount").value =
      item.amount || "";

    document.getElementById("memo").value =
      item.memo || "";


    editingIndex = index;


    document.getElementById("saveButton").textContent =
      "変更を保存";

    document.getElementById("cancelButton").style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // 編集をキャンセル
  function cancelEdit() {

    editingIndex = -1;

    clearForm();

    document.getElementById("saveButton").textContent =
      "記録する";

    document.getElementById("cancelButton").style.display =
      "none";

  }


  // 削除
  function deleteRecord(index) {

    const answer =
      confirm("この記録を削除しますか？");

    if (!answer) {
      return;
    }


    records.splice(index, 1);


    localStorage.setItem(
      "unchiRecords",
      JSON.stringify(records)
    );


    displayRecords();

    updateStats();

    displayCalendar();

  }


  // 入力欄を空にする
  function clearForm() {

    document.getElementById("date").value =
      getToday();

    document.getElementById("time").value =
      getCurrentTime();

    document.getElementById("condition").value =
      "";

    document.getElementById("amount").value =
      "";

    document.getElementById("memo").value =
      "";

  }


  // 集計
  function updateStats() {

    const today =
      getToday();


    // 今日
    const todayRecords =
      records.filter(function(item) {

        return item.date === today;

      });


    document.getElementById("todayCount").textContent =
      todayRecords.length;


    // 今週
    const now = new Date();

    const day =
      now.getDay();

    const startOfWeek =
      new Date(now);

    startOfWeek.setDate(
      now.getDate() - day
    );

    startOfWeek.setHours(0, 0, 0, 0);


    const weekRecords =
      records.filter(function(item) {

        const d =
          new Date(item.date + "T" + item.time);

        return d >= startOfWeek && d <= now;

      });


    document.getElementById("weekCount").textContent =
      weekRecords.length;


    // 今月
    const year =
      now.getFullYear();

    const month =
      now.getMonth();


    const monthRecords =
      records.filter(function(item) {

        const d =
          new Date(item.date + "T" + item.time);

        return (
          d.getFullYear() === year &&
          d.getMonth() === month
        );

      });


    document.getElementById("monthCount").textContent =
      monthRecords.length;


    // 前回からの間隔
    if (records.length >= 2) {

      const latest =
        new Date(
          records[0].date +
          "T" +
          records[0].time
        );

      const previous =
        new Date(
          records[1].date +
          "T" +
          records[1].time
        );


      const difference =
        latest - previous;


      const hours =
        Math.round(
          difference / (1000 * 60 * 60)
        );


      if (hours < 24) {

        document.getElementById("interval").textContent =
          hours + "時間";

      }

      else {

        const days =
          Math.floor(hours / 24);

        const remainingHours =
          hours % 24;

        document.getElementById("interval").textContent =
          days + "日" +
          (remainingHours > 0
            ? remainingHours + "時間"
            : "");

      }

    }

    else {

      document.getElementById("interval").textContent =
        "---";

    }

  }


  // カレンダー表示
  function displayCalendar() {

    const calendar =
      document.getElementById("calendar");

    calendar.innerHTML = "";


    const year =
      calendarDate.getFullYear();

    const month =
      calendarDate.getMonth();


    document.getElementById("calendarTitle").textContent =
      year + "年 " + (month + 1) + "月";


    const weekdays =
      ["日", "月", "火", "水", "木", "金", "土"];


    weekdays.forEach(function(day) {

      const element =
        document.createElement("div");

      element.className = "weekday";

      element.textContent = day;

      calendar.appendChild(element);

    });


    const firstDay =
      new Date(year, month, 1).getDay();


    const lastDate =
      new Date(year, month + 1, 0).getDate();


    // 月初の空白
    for (let i = 0; i < firstDay; i++) {

      const blank =
        document.createElement("div");

      calendar.appendChild(blank);

    }


    for (let day = 1; day <= lastDate; day++) {

      const element =
        document.createElement("div");

      element.className = "day";


      const dateString =
        year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0");


      const dayRecords =
        records.filter(function(item) {

          return item.date === dateString;

        });


      element.innerHTML =
        day +
        (
          dayRecords.length > 0
            ? `<span class="poop">💩 ${dayRecords.length}</span>`
            : ""
        );


      if (dateString === getToday()) {

        element.classList.add("today");

      }


      if (dayRecords.length > 0) {

        element.classList.add("has-record");

      }


      calendar.appendChild(element);

    }

  }


  // カレンダーの月を変更
  function changeMonth(amount) {

    calendarDate.setMonth(
      calendarDate.getMonth() + amount
    );

    displayCalendar();

  }


  // 最初に実行
  clearForm();

  displayRecords();

  updateStats();

  displayCalendar();

</script>

</body>
</html>
