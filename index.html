<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うんち記録</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f1e8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      height: 80px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #8b6f47;
      color: white;
      cursor: pointer;
    }

    .record {
      margin-top: 20px;
      padding: 15px;
      background: #f7f1e8;
      border-radius: 10px;
    }

    .edit-button,
    .delete-button {
      width: auto;
      padding: 8px 12px;
      margin-top: 10px;
      margin-right: 5px;
      font-size: 14px;
    }

    .edit-button {
      background: #777;
    }

    .delete-button {
      background: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💩 うんち記録</h1>

    <label>日にち</label>
    <input type="date" id="date">

    <label>時間</label>
    <input type="time" id="time">

    <label>状態</label>
    <select id="condition">
      <option value="">選んでね</option>
      <option>硬い</option>
      <option>普通</option>
      <option>やや柔らかい</option>
      <option>柔らかい</option>
      <option>下痢</option>
    </select>

    <label>メモ</label>
    <textarea id="memo" placeholder="色・量・お腹の調子など"></textarea>

    <button onclick="record()">記録する</button>

    <div id="records"></div>

  </div>

  <script>

    // 保存されている記録を読み込む
    let records = JSON.parse(localStorage.getItem("unchiRecords")) || [];

    // 編集中の記録番号
    let editingIndex = -1;


    // 記録を画面に表示
    function displayRecords() {

      const recordsArea = document.getElementById("records");

      recordsArea.innerHTML = "";

      records.forEach(function(item, index) {

        const record = document.createElement("div");

        record.className = "record";

        record.innerHTML = `
          <strong>${item.date} ${item.time}</strong><br>
          状態：${item.condition}<br>
          メモ：${item.memo || "なし"}

          <br>

          <button class="edit-button" onclick="editRecord(${index})">
            ✏️ 編集
          </button>

          <button class="delete-button" onclick="deleteRecord(${index})">
            🗑️ 削除
          </button>
        `;

        recordsArea.appendChild(record);

      });

    }


    // 新しい記録を追加
    function record() {

      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const condition = document.getElementById("condition").value;
      const memo = document.getElementById("memo").value;


      if (!date || !time || !condition) {

        alert("日にち・時間・状態を入力してね");

        return;
      }


      // 編集中の場合
      if (editingIndex !== -1) {

        records[editingIndex] = {
          date: date,
          time: time,
          condition: condition,
          memo: memo
        };

        editingIndex = -1;

        document.querySelector("button[onclick='record()']").textContent =
          "記録する";

        alert("記録を変更しました！");

      }

      // 新しい記録の場合
      else {

        const newRecord = {
          date: date,
          time: time,
          condition: condition,
          memo: memo
        };

        records.push(newRecord);

        alert("記録しました！");
      }


      // 保存
      localStorage.setItem(
        "unchiRecords",
        JSON.stringify(records)
      );


      // 画面を更新
      displayRecords();


      // 入力欄を空にする
      document.getElementById("date").value = "";
      document.getElementById("time").value = "";
      document.getElementById("condition").value = "";
      document.getElementById("memo").value = "";

    }


    // 編集する
    function editRecord(index) {

      const item = records[index];

      document.getElementById("date").value = item.date;
      document.getElementById("time").value = item.time;
      document.getElementById("condition").value = item.condition;
      document.getElementById("memo").value = item.memo;

      editingIndex = index;

      document.querySelector("button[onclick='record()']").textContent =
        "変更を保存";

    }


    // 削除する
    function deleteRecord(index) {

      const answer = confirm("この記録を削除しますか？");

      if (!answer) {
        return;
      }

      records.splice(index, 1);

      localStorage.setItem(
        "unchiRecords",
        JSON.stringify(records)
      );

      displayRecords();

    }


    // ページを開いたときに記録を表示
    displayRecords();

  </script>

</body>
</html>
